# Replace topic names, message types and transforms with the measured setup.
robots:
  ugv1:
    kind: ugv
    pose_topic: /ugv1/pose
    pose_type: PoseStamped
    velocity_topic: /ugv1/twist
    velocity_type: TwistStamped
    imu_topic: /ugv1/imu
    pose_frame: map
    velocity_frame: world
    cmd_frame: body
    transform:
      yaw: 0.0
      translation:
      - 0.0
      - 0.0
      - 0.0
